services: # Seperate containers to run
    ollama: # Ollama LLM server
      image: ollama/ollama
      ports:
        - "11434:11434"
      environment:
        - OLLAMA_NUM_PARALLEL=1
        # Ollama's default 5-minute idle unload means every dimension call
        # pays a full cold model-load between requests -- keep it resident
        # for the whole assessment run instead.
        - OLLAMA_KEEP_ALIVE=30m
      volumes:
        - ollama_models:/root/.ollama
        - ./:/ai-engine
      # For GPU support add:
      # deploy:
      #   resources:
      #     reservations:
      #       devices:
      #         - driver: nvidia
      #           count: all
      #           capabilities: [gpu]

    model-init:
      image: ollama/ollama
      volumes:
        - ollama_models:/root/.ollama
        - ./:/ai-engine
      environment:
        - OLLAMA_HOST=http://ollama:11434
      depends_on:
        ollama:
          condition: service_started
      entrypoint: ["/bin/sh", "-c"]
      command:
        - |
          sleep 10
          if ! ollama list | grep -q sprintsight-llama; then
            ollama pull llama3.2 &&
            ollama create sprintsight-llama -f /ai-engine/models/Modelfile.llama
          fi
          if ! ollama list | grep -q sprintsight-qwen; then
            ollama pull qwen3:8b &&
            ollama create sprintsight-qwen -f /ai-engine/models/Modelfile.qwen
          fi
          if ! ollama list | grep -q sprintsight-mistral; then
            ollama pull mistral:7b &&
            ollama create sprintsight-mistral -f /ai-engine/models/Modelfile.mistral
          fi
          if ! ollama list | grep -q sprintsight-gemma; then
            ollama pull gemma4:12b &&
            ollama create sprintsight-gemma -f /ai-engine/models/Modelfile.gemma
          fi
          if ! ollama list | grep -q sprintsight-llama31; then
            ollama pull llama3.1:8b &&
            ollama create sprintsight-llama31 -f /ai-engine/models/Modelfile.llama31
          fi
          # The three 32B models below need a ~24 GB GPU and are large (~20 GB
          # each). Comment them out if you are not running the comparison study.
          if ! ollama list | grep -q sprintsight-qwen25-32b; then
            ollama pull qwen2.5:32b &&
            ollama create sprintsight-qwen25-32b -f /ai-engine/models/Modelfile.qwen25-32b
          fi
          if ! ollama list | grep -q sprintsight-r1-32b; then
            ollama pull deepseek-r1:32b &&
            ollama create sprintsight-r1-32b -f /ai-engine/models/Modelfile.deepseek-r1
          fi
          if ! ollama list | grep -q sprintsight-coder-32b; then
            ollama pull qwen2.5-coder:32b &&
            ollama create sprintsight-coder-32b -f /ai-engine/models/Modelfile.qwen25-coder
          fi
          if ! ollama list | grep -q sprintsight-judge-phi; then
            ollama pull phi4:14b &&
            ollama create sprintsight-judge-phi -f /ai-engine/models/Modelfile.phi
          fi
      restart: "no"

    sprintsight_ai:
      build: .
      ports:
        - "8001:8001"
      # IMPROVEMENT: Add restart policy
      restart: unless-stopped
      environment:
        # Fallback to the Docker service name 'ollama' instead of localhost
        - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434/v1}
        
        # Fallback to the Docker service name 'mlflow' instead of localhost
        - MLFLOW_TRACKING_URI=${MLFLOW_TRACKING_URI:-http://mlflow_service:5000}
        
        # Add missing model variable (defaults to llama3 if not in .env)
        - DEFAULT_MODEL_NAME=${DEFAULT_MODEL_NAME:-sprintsight-llama}
        
        # Moved from the mlflow service to here where the FastAPI client actually uses it
        - MLFLOW_EXPERIMENT_NAME=${MLFLOW_EXPERIMENT_NAME:-sprintsight_experiment}
        - LLM_AUDIT_LOG_DIR=/app/audit_logs

        # debug print of the full ingested bundle on /assess/sprint/data
        - LOG_BUNDLE_DISPLAY=${LOG_BUNDLE_DISPLAY:-false}
      volumes:
        - ./:/app
        - ./audit_logs:/app/audit_logs
        
      depends_on:
        db:
          condition: service_healthy
        ollama:
          condition: service_started # Change to service_healthy if your ollama service has a healthcheck
        model-init:
          condition: service_completed_successfully
        mlflow_service:
          condition: service_started

    mlflow_service:
      image: ghcr.io/mlflow/mlflow:latest # Automatically pulls MLflow
      # --backend-store-uri points to the Postgres container
      command: mlflow server --host 0.0.0.0 --port 5000 --allowed-hosts '*' --backend-store-uri postgresql://user:pass@db:5432/sprintsight
      environment: 
        - MLFLOW_EXPERIMENT_NAME=${MLFLOW_EXPERIMENT_NAME:-sprintsight_experiment}
      ports:
        - "5000:5000"
      restart: unless-stopped
      depends_on:
        db:
          condition: service_healthy
      healthcheck:
        test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
        interval: 10s
        timeout: 5s
        retries: 5

    db: # PostgreSQL database container
      image: postgres:16
      environment:
        POSTGRES_DB: sprintsight
        POSTGRES_USER: user
        POSTGRES_PASSWORD: pass
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U user"]
        interval: 5s
        timeout: 5s
        retries: 5
      volumes:
        - postgres_data:/var/lib/postgresql/data

volumes: # Named volumes for data persistence (not to be deleted)
  ollama_models:
  postgres_data: