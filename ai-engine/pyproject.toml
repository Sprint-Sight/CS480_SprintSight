[tool.mypy]
exclude = ["^\\.venv/"]
explicit_package_bases = true
namespace_packages = true
mypy_path = "."

# WIP judge-pipeline modules, blocked on the not-yet-added schemas/cs203_groundtruth
# (gold bundles + reference scores) and judge helpers (audit_scope, request_extra_body).
# Re-enable type-checking by removing this override once those exist.
# (evaluation.offline.judge_canary was taken off this list once its import was fixed; it type-checks.)
[[tool.mypy.overrides]]
module = ["evaluation.judges.citation_grounding", "evaluation.online.run_judges"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
