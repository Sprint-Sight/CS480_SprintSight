[tool.mypy]
exclude = ["^\\.venv/"]
explicit_package_bases = true
namespace_packages = true
mypy_path = "."

# The two judge modules still have 7 type errors with this override removed (team_id/sprint_id
# typed str | None where a str key is needed; pandas row keys typed Hashable; two unannotated
# lists). Fix those, then delete this override.
[[tool.mypy.overrides]]
module = ["evaluation.judges.citation_grounding", "evaluation.online.run_judges"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
