[tool.mypy]
exclude = ["^\\.venv/"]
explicit_package_bases = true
namespace_packages = true
mypy_path = "."

# WIP judge-pipeline modules, blocked on the not-yet-added schemas/cs203_groundtruth
# (gold bundles + reference scores) and judge helpers (audit_scope, request_extra_body).
# Re-enable type-checking by removing this override once those exist.
[[tool.mypy.overrides]]
module = ["judges.citation_ground_custom_judge", "judges.run_judges", "research.judge_canary"]
ignore_errors = true
