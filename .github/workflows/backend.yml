name: backend CI

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

jobs:
  backend-check:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: lint
        run: |
          ruff check .

      - name: type-check
        run: |
          pip install mypy
          mypy app

      - name: backend unit tests
        run: |
          pytest --cov=app --cov-report=term-missing --cov-report=xml -q

      - name: security scan
        run: |
          pip install bandit
          bandit -r app

      - name: docker build check
        run: |
          docker build -t sprintsight-backend-test -f Dockerfile .