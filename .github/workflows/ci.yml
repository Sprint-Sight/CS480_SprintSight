name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------------------------
  # 1. Path Filter Job: Detects which components changed in the pull request
  # ------------------------------------------------------------------------------------
  changes:
    name: Detect changed packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ai-engine: ${{ steps.filter.outputs['ai-engine'] }}
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ai-engine:
              - 'ai-engine/**'
              - '.github/workflows/ci.yml'
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

  # ------------------------------------------------------------------------------------
  # 2. AI Engine Job
  # ------------------------------------------------------------------------------------
  ai-engine:
    name: AI Engine
    needs: changes
    if: needs.changes.outputs['ai-engine'] == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-engine/requirements.txt

      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov ruff==0.17.0 mypy bandit pandas-stubs

      - name: lint
        run: ruff check .

      - name: type-check
        run: mypy .

      - name: test with coverage
        run: pytest --cov=. --cov-report=term-missing --cov-report=xml -q || test $? -eq 5

      - name: security scan
        run: bandit -r . -ll -x ./tests

      - name: docker build check
        run: docker build -t sprintsight-ai-engine-test -f Dockerfile .

  # ------------------------------------------------------------------------------------
  # 3. Backend Job
  # ------------------------------------------------------------------------------------
  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: lint
        run: ruff check .

      - name: type-check
        run: |
          pip install mypy
          mypy app

      - name: backend unit tests
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml -q

      - name: security scan
        run: |
          pip install bandit
          bandit -r app

      - name: docker build check
        run: docker build -t sprintsight-backend-test -f Dockerfile .

  # ------------------------------------------------------------------------------------
  # 4. Frontend Job
  # ------------------------------------------------------------------------------------
  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: install dependencies
        run: npm ci

      - name: lint
        run: npm run lint

      - name: typecheck
        run: npx tsc --noEmit

      - name: test
        run: npm run test

      - name: build
        run: npm run build

      - name: scan frontend files and dependencies
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: frontend
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table

      - name: build frontend image for scanning
        run: docker build --file Dockerfile --tag sprintsight-frontend:ci --build-arg NEXT_PUBLIC_API_BASE_URL=http://localhost:8000/api/v1 .

      - name: scan frontend image
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: sprintsight-frontend:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table

  # ------------------------------------------------------------------------------------
  # 5. Authoritative Gatekeeper Job (REQUIRED FOR BRANCH PROTECTION)
  # ------------------------------------------------------------------------------------
  ci-passed:
    name: CI passed
    needs: [changes, ai-engine, backend, frontend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check the results of every job
        env:
          RESULTS: ${{ toJson(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if ! echo "$RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null; then
            echo "::error::A required job failed or was cancelled."
            exit 1
          fi