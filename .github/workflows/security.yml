name: Security

on:
  pull_request:
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  TRIVY_VERSION: "0.76.1"
  TRIVY_SHA256: "c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0"

jobs:
  # ------------------------------------------------------------------------------------
  # 1. Secret Scanning (Gitleaks across full repository git history)
  # ------------------------------------------------------------------------------------
  gitleaks:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks (pinned release, checksum verified)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Scan git history for leaked credentials
        run: gitleaks git --redact --verbose --no-banner --exit-code 1 .

  # ------------------------------------------------------------------------------------
  # 2. Python Static Application Security Testing (Bandit for Backend & AI Engine)
  # ------------------------------------------------------------------------------------
  python-sast:
    name: Python Security Scan (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: pip install bandit

      - name: Scan Backend
        run: bandit -r backend/app -ll

      - name: Scan AI Engine
        run: bandit -r ai-engine -ll -x ./ai-engine/tests

  # ------------------------------------------------------------------------------------
  # 3. Dependency & Container Vulnerability Scan (Trivy for Frontend)
  # ------------------------------------------------------------------------------------
  trivy-frontend:
    name: Frontend Security & Container Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Trivy (pinned release, checksum verified)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -sSfL -o trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum --check
          tar -xzf trivy.tar.gz trivy
          sudo install -m 0755 trivy /usr/local/bin/trivy

      - name: Scan Frontend Files & npm Dependencies
        run: trivy fs frontend --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1

      - name: Build Frontend Docker Image (fresh base image, no stale cache)
        run: |
          docker pull node:20-bookworm-slim
          docker build --pull -t sprintsight-frontend:security-scan --build-arg NEXT_PUBLIC_API_BASE_URL=http://localhost:8000/api/v1 ./frontend

      - name: Scan Frontend Container Image
        run: trivy image sprintsight-frontend:security-scan --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1

  # ------------------------------------------------------------------------------------
  # 4. Dependency Audits (npm audit & pip audit)
  # ------------------------------------------------------------------------------------
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Audit npm packages
        working-directory: frontend
        run: npm audit --audit-level=high

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit Python packages
        run: |
          pip install pip-audit
          pip-audit --desc on -r backend/pyproject.toml || true

  # ------------------------------------------------------------------------------------
  # 5. Security Gatekeeper Job (For Branch Protection status check)
  # ------------------------------------------------------------------------------------
  security-passed:
    name: Security passed
    needs: [gitleaks, python-sast, trivy-frontend, dependency-audit]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all security checks passed
        env:
          RESULTS: ${{ toJson(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if ! echo "$RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null; then
            echo "::error::A required security check failed."
            exit 1
          fi