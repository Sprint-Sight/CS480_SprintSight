name: ai-engine CI

on:
  push:
    paths:
      - "ai-engine/**"
      - ".github/workflows/ai-engine.yml"
  pull_request:
    paths:
      - "ai-engine/**"
      - ".github/workflows/ai-engine.yml"

permissions:
  contents: read

jobs:
  ai-engine-check:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ai-engine

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-engine/requirements.txt

      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov ruff==0.17.0 mypy bandit pandas-stubs

      - name: lint
        run: |
          ruff check .

      - name: type-check
        run: |
          mypy .

      - name: test with coverage
        run: |
          pytest --cov=. --cov-report=term-missing --cov-report=xml -q || test $? -eq 5
        continue-on-error: true

      - name: security scan
        run: |
          bandit -r .
        continue-on-error: true

      - name: docker build check
        run: |
          docker build -t sprintsight-ai-engine-test -f Dockerfile .
        continue-on-error: true
