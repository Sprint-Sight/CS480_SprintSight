name: frontend CI

on:
  push:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: check out repository
        uses: actions/checkout@v4

      - name: set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: install dependencies
        run: npm ci

      - name: lint
        run: npm run lint

      - name: typecheck
        run: npx tsc --noEmit

      - name: test
        run: npm run test

      - name: build
        run: npm run build

  frontend-security:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: check out repository
        uses: actions/checkout@v4

      # Report HIGH and CRITICAL findings without blocking CI while the existing baseline is triaged.
      - name: scan frontend files and dependencies
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: frontend
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          exit-code: "0"
          format: table

      - name: build frontend image for scanning
        run: docker build --file Dockerfile --tag sprintsight-frontend:ci --build-arg NEXT_PUBLIC_API_BASE_URL=http://localhost:8000/api/v1 .
        working-directory: frontend

      - name: scan frontend image
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: sprintsight-frontend:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "0"
          format: table
