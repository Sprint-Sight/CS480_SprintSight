version: "3.9"

services:
  frontend:
      build:
        context: ../frontend
        dockerfile: Dockerfile
        args:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
      container_name: sprintsight-frontend
      restart: unless-stopped
      ports:
        - "3000:3000"
      depends_on:
        - backend

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sprintsight-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
      - .:/app                          # hot reload in development
      - ../repo:/app/repo:ro            # professor-provided student clones
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      LOCAL_REPOSITORY_ROOT: /app/repo
      AI_ENGINE_URL: ${AI_ENGINE_URL:-http://host.docker.internal:8001}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg16
    container_name: sprintsight-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sprintsight
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sprintsight"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: sprintsight-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in backend/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in backend/.env}
    ports:
      - "9000:9000"                     # S3 API — boto3 connects here
      - "9001:9001"                     # Web console — open in browser
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:                        # persists DB data across restarts
  minio_data:                           # persists uploaded files across restarts
