x-app-defaults: &app-defaults
  restart: unless-stopped
  networks: [app]

x-backend-defaults: &backend-defaults
  <<: *app-defaults
  build:
    context: .
    dockerfile: Dockerfile
  image: sprintsight-backend:local
  env_file: .env

services:
  frontend:
    <<: *app-defaults
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    container_name: sprintsight-frontend
    ports: ["3000:3000"]
    depends_on: [backend]

  backend:
    <<: *backend-defaults
    container_name: sprintsight-backend
    ports: ["8000:8000"]
    volumes:
      - ./logs:/app/logs
      - .:/app
      - ../repo:/app/repo:ro
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      LOCAL_REPOSITORY_ROOT: /app/repo
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy

  audit-retention:
    <<: *backend-defaults
    container_name: sprintsight-audit-retention
    command: ["python", "-m", "app.services.auditLogService.retention", "--loop"]
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy

  db:
    <<: *app-defaults
    image: pgvector/pgvector:pg16
    container_name: sprintsight-db
    environment:
      POSTGRES_DB: sprintsight
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sprintsight"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    <<: *app-defaults
    image: minio/minio:latest
    container_name: sprintsight-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in backend/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in backend/.env}
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  app:

volumes:
  postgres_data:
  minio_data:
